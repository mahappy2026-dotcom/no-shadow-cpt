name: Windows RDP project testing (Auth key)

on:
  workflow_dispatch:
    inputs:
      client_ip:
        description: 'Your connecting device Tailscale IPv4 address (100.x.y.z)'
        required: true
        type: string
      duration_minutes:
        description: 'RDP test session duration in minutes'
        required: true
        default: '60'
        type: choice
        options: ['30', '60', '120', '180', '300']

permissions:
  contents: read

concurrency:
  group: windows-rdp-project-testing
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      RDP_CLIENT_IP: ${{ inputs.client_ip }}
      SESSION_MINUTES: ${{ inputs.duration_minutes }}

    steps:
      - name: Validate settings
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw 'Set the TAILSCALE_AUTHKEY repository secret.'
          }
          $password = $env:RDP_PASSWORD
          if ($password.Length -lt 16 -or $password.Length -gt 128 -or
              $password -cnotmatch '[A-Z]' -or $password -cnotmatch '[a-z]' -or
              $password -notmatch '[0-9]' -or $password -notmatch '[^a-zA-Z0-9]') {
            throw 'RDP_PASSWORD must be 16-128 characters with uppercase, lowercase, a number and a symbol.'
          }
          $clientIp = [System.Net.IPAddress]::Parse($env:RDP_CLIENT_IP)
          $bytes = $clientIp.GetAddressBytes()
          if ($clientIp.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork -or
              $bytes[0] -ne 100 -or $bytes[1] -lt 64 -or $bytes[1] -gt 127) {
            throw 'client_ip must be your device Tailscale IPv4 address in 100.64.0.0/10.'
          }
          if ($env:SESSION_MINUTES -notin @('30', '60', '120', '180', '300')) {
            throw 'Unsupported session duration.'
          }

      - name: Checkout project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Connect Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        timeout-minutes: 15
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-rdp-${{ github.run_id }}-${{ github.run_attempt }}
          args: --accept-routes=false --shields-up=false

      - name: Configure RDP
        timeout-minutes: 5
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tailscaleIp = (& tailscale ip -4 | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tailscaleIp) {
            throw 'Cannot determine runner Tailscale IPv4 address.'
          }
          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name 'runneradmin' -Password $password
          Enable-LocalUser -Name 'runneradmin'

          # Replace the built-in RDP rules with a rule for one Tailscale peer.
          Get-NetFirewallRule -Name 'RemoteDesktop*' -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule
          New-NetFirewallRule -Name 'GitHub-RDP-Tailscale-Test' `
            -DisplayName 'GitHub RDP test via Tailscale' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -LocalAddress $tailscaleIp -RemoteAddress $env:RDP_CLIENT_IP `
            -Profile Any | Out-Null

          $terminalServer = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $terminalServer -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path "$terminalServer\WinStations\RDP-Tcp" `
            -Name 'UserAuthentication' -Value 1
          Set-Service -Name TermService -StartupType Manual
          Restart-Service -Name TermService -Force
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw 'RDP did not start listening on TCP 3389.' }

          $username = "$env:COMPUTERNAME\runneradmin"
          $endsAt = [DateTimeOffset]::UtcNow.AddMinutes([int]$env:SESSION_MINUTES).ToString('u')
          $summary = @(
            '## Windows project test session',
            '',
            "- RDP address: $tailscaleIp`:3389",
            "- Username: $username",
            '- Password: the value of your RDP_PASSWORD repository secret',
            "- Allowed client Tailscale IP: $env:RDP_CLIENT_IP",
            "- Project folder: $env:GITHUB_WORKSPACE",
            "- Scheduled end (UTC): $endsAt",
            '- Use Cancel workflow when testing is finished.',
            '- Save needed files before the job ends; this VM is temporary.'
          )
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host "RDP ready: $tailscaleIp`:3389 | User: $username"

      - name: Keep project test session available
        run: |
          $endsAt = [DateTimeOffset]::UtcNow.AddMinutes([int]$env:SESSION_MINUTES)
          while ([DateTimeOffset]::UtcNow -lt $endsAt) {
            Start-Sleep -Seconds 30
          }

      - name: Close RDP
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 1
          Remove-NetFirewallRule -Name 'GitHub-RDP-Tailscale-Test' -ErrorAction SilentlyContinue
          # Tailscale's action post-step logs the ephemeral device out.
